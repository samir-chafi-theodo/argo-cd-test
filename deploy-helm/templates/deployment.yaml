{{- range $elem := .Values.pages }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-deployment-{{ $elem }}
  labels:
    app: nginx
  {{- with $.Values.annotations }}
  annotations:
  {{- toYaml . | nindent 6 }}
  {{- end }} 
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: {{ $.Values.replicas }}
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: my-html
          mountPath: /usr/share/nginx/html/index.html
          subPath: page-{{ $elem }}.html
      volumes:
      - name: my-html
        configMap:
          name: my-configmap-{{ $elem }}
---
{{- end }}